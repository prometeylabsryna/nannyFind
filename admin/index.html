<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Адмін</title>
  <meta name="description" content="">
  <link rel="icon" href="/favicon.ico" sizes="any">
  <link rel="icon" href="/images/favicon-32x32.png" type="image/png" sizes="32x32">
  <link rel="icon" href="/images/favicon-16x16.png" type="image/png" sizes="16x16">
  <link rel="apple-touch-icon" href="/images/apple-touch-icon.png" sizes="180x180">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,500;0,9..40,600;0,9..40,700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/globals.css">
  
  <link rel="stylesheet" href="/css/header.css">
  <link rel="stylesheet" href="/css/footer.css">
  <link rel="stylesheet" href="/css/hero.css">
  <link rel="stylesheet" href="/css/nanny.css">
  <link rel="stylesheet" href="/css/calendar.css">
  <link rel="stylesheet" href="/css/auth.css">
  <link rel="stylesheet" href="/css/documents.css">
  <link rel="stylesheet" href="/css/page-decor.css">
  <link rel="stylesheet" href="/css/cabinet.css">
  <link rel="stylesheet" href="/css/payments.css">
  <link rel="stylesheet" href="/css/admin.css">
  <script src="https://unpkg.com/htmx.org@2.0.4/dist/htmx.min.js"></script>
</head>
<body>
  <div id="site-header" hx-get="/partials/header.html" hx-trigger="load" hx-swap="innerHTML"></div>
  <main>
<div class="container cabinet-layout admin-layout">
  <div class="cabinet-mobile-nav" id="admin-mobile-nav"></div>
  <aside class="cabinet-sidebar admin-sidebar"><nav class="card" id="admin-nav"></nav></aside>
  <div class="admin-main">
  <h1 class="cabinet-title">Дашборд</h1>
  <p class="cabinet-subtitle">Огляд платформи «Поміч поруч»</p>
  <div class="admin-alert-grid" id="admin-alerts"></div>
  <div class="stat-grid admin-stat-grid">
    <div class="card stat-card"><div class="stat-value" data-stat="users">0</div><div class="stat-label">Користувачі</div></div>
    <div class="card stat-card"><div class="stat-value" data-stat="nannies">0</div><div class="stat-label">Няні</div></div>
    <div class="card stat-card"><div class="stat-value" data-stat="revenue">₴0</div><div class="stat-label">Дохід</div></div>
    <div class="card stat-card"><div class="stat-value" data-stat="payments">0</div><div class="stat-label">Оплат</div></div>
  </div>
  <div class="admin-quick card">
    <h2 class="admin-section-title">Швидкі дії</h2>
    <div class="admin-quick-grid">
      <a href="/admin/profiles" class="admin-quick-link">Модерація профілів</a>
      <a href="/admin/documents" class="admin-quick-link">Перевірка документів</a>
      <a href="/admin/users" class="admin-quick-link">Користувачі</a>
      <a id="django-admin-link" href="#" class="admin-quick-link admin-quick-link--accent" target="_blank" rel="noopener">Повна адмінка Django →</a>
    </div>
  </div>
</div>
</div>
</main>
  <div id="site-footer" hx-get="/partials/footer.html" hx-trigger="load" hx-swap="innerHTML"></div>
  <div hx-get="/partials/cookie.html" hx-trigger="load" hx-swap="innerHTML"></div>
  <script src="/js/routes.js"></script>
  <script src="/js/mock-data.js"></script>
  <script src="/js/api.js"></script>
  <script src="/js/roles.js"></script>
  <script src="/js/render.js"></script>
  <script src="/js/calendar.js"></script>
  <script src="/js/validation.js"></script>
  <script src="/js/auth.js"></script>
  <script src="/js/cabinet-core.js"></script>
  <script src="/js/cabinet-parent.js"></script>
  <script src="/js/cabinet-nanny.js"></script>
  <script src="/js/cabinet-admin.js"></script>
  <script src="/js/payments.js"></script>
  <script src="/js/content-loader.js"></script>
  <script src="/js/site-content.js"></script>
  <script src="/js/app.js"></script>
  
  <script>
    document.body.addEventListener('htmx:afterSwap', function(e) {
      PP.afterPartialSwap?.(e.detail.target);
      if (e.detail.target.id === 'site-header') PP.initLayout();
    });
    document.addEventListener('DOMContentLoaded', async function() {
      if (PP.loadSiteContent) await PP.loadSiteContent();
      PP.initLayout();
      PP.initCookie();
      PP.initCabinetPage();
    });
  </script>
</body>
</html>
