# Статичний фронтенд з чистими URL (окремо від Django API)
server {
    listen 8082;
    root /var/www/pomich-poruch;
    index index.html;
    client_max_body_size 20M;

    location /api/ {
        proxy_pass http://django:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /ws/ {
        proxy_pass http://django:8000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 86400;
    }

    location /media/chat/ {
        deny all;
        return 404;
    }

    location /media/ {
        proxy_pass http://django:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /faq/ { try_files /faq.html =404; }
    location = /services/ { try_files /services.html =404; }

    location = /register { try_files /register.html =404; }
    location = /login { try_files /login.html =404; }
    location = /forgot-password { try_files /forgot-password.html =404; }
    location = /reset-password { try_files /reset-password.html =404; }
    location = /how-it-works { try_files /how-it-works.html =404; }
    location = /contacts { try_files /contacts.html =404; }
    location = /services { try_files /services.html =404; }
    location = /faq { try_files /faq.html =404; }
    location = /public-offer { try_files /public-offer.html =404; }
    location = /terms-of-service { try_files /terms-of-service.html =404; }
    location = /privacy-policy { try_files /privacy-policy.html =404; }
    location = /cookie-policy { try_files /cookie-policy.html =404; }

    location = /nanny { return 301 /nanny/; }
    location = /nanny/ { try_files /nanny/index.html =404; }
    location ~ ^/nanny/(\d+)/?$ { try_files /nanny/profile.html =404; }

    location = /blog { return 301 /blog/; }
    location = /blog/ { try_files /blog/index.html =404; }
    location ~ ^/blog/([\w-]+)/?$ { try_files /blog/article.html =404; }

    location ~ ^/city/([\w-]+)/?$ { try_files /city/$1.html =404; }

    location = /cabinet/parent { return 301 /cabinet/parent/; }
    location = /cabinet/parent/ { try_files /cabinet/parent/index.html =404; }
    location = /cabinet/parent/search { try_files /cabinet/parent/search.html =404; }
    location = /cabinet/parent/profile { try_files /cabinet/parent/profile.html =404; }
    location = /cabinet/parent/favorites { try_files /cabinet/parent/favorites.html =404; }
    location = /cabinet/parent/chat { try_files /cabinet/parent/chat.html =404; }
    location = /cabinet/parent/payments { try_files /cabinet/parent/payments.html =404; }
    location = /cabinet/parent/reviews { try_files /cabinet/parent/reviews.html =404; }

    location = /cabinet/nanny { return 301 /cabinet/nanny/; }
    location = /cabinet/nanny/ { try_files /cabinet/nanny/index.html =404; }
    location = /cabinet/nanny/profile { try_files /cabinet/nanny/profile.html =404; }
    location = /cabinet/nanny/calendar { try_files /cabinet/nanny/calendar.html =404; }
    location = /cabinet/nanny/documents { try_files /cabinet/nanny/documents.html =404; }
    location = /cabinet/nanny/messages { try_files /cabinet/nanny/messages.html =404; }
    location = /cabinet/nanny/rating { try_files /cabinet/nanny/rating.html =404; }

    location = /admin { return 301 /admin/; }
    location = /admin/ { try_files /admin/index.html =404; }
    location = /admin/users { try_files /admin/users.html =404; }
    location = /admin/profiles { try_files /admin/profiles.html =404; }
    location = /admin/documents { try_files /admin/documents.html =404; }
    location = /admin/messages { try_files /admin/messages.html =404; }
    location = /admin/content { try_files /admin/content.html =404; }
    location = /admin/finance { try_files /admin/finance.html =404; }
    location = /admin/analytics { try_files /admin/analytics.html =404; }

    location / {
        try_files $uri $uri/ $uri.html =404;
    }
}
