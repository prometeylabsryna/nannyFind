<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Документи</title>
  <meta name="description" content="">
  <link rel="icon" href="/favicon.ico" sizes="any">
  <link rel="icon" href="/images/favicon-32x32.png" type="image/png" sizes="32x32">
  <link rel="icon" href="/images/favicon-16x16.png" type="image/png" sizes="16x16">
  <link rel="apple-touch-icon" href="/images/apple-touch-icon.png" sizes="180x180">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,500;0,9..40,600;0,9..40,700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/globals.css">
  
  <link rel="stylesheet" href="/css/header.css">
  <link rel="stylesheet" href="/css/footer.css">
  <link rel="stylesheet" href="/css/hero.css">
  <link rel="stylesheet" href="/css/nanny.css">
  <link rel="stylesheet" href="/css/calendar.css">
  <link rel="stylesheet" href="/css/auth.css">
  <link rel="stylesheet" href="/css/documents.css">
  <link rel="stylesheet" href="/css/page-decor.css">
  <link rel="stylesheet" href="/css/cabinet.css">
  <link rel="stylesheet" href="/css/payments.css">
  <script src="https://unpkg.com/htmx.org@2.0.4/dist/htmx.min.js"></script>
</head>
<body>
  <div id="site-header" hx-get="/partials/header.html" hx-trigger="load" hx-swap="innerHTML"></div>
  <main>
<div class="container cabinet-layout">
  <div class="cabinet-mobile-nav" id="nanny-mobile-nav"></div>
  <aside class="cabinet-sidebar"><nav class="card" id="nanny-nav"></nav></aside>
  <div><h1 class="cabinet-title">Документи</h1>
  <p class="cabinet-subtitle">Завантажте скани для перевірки адміністратором</p>
  <div class="card" id="doc-list"></div>
  <form class="card doc-upload-form" id="doc-upload-form">
    <div class="doc-upload-row">
      <div><label class="label">Тип документа</label>
      <select class="field" name="doc_type" required>
        <option value="passport">Паспорт (скан)</option>
        <option value="ipn">ІПН</option>
        <option value="first_aid">Сертифікат першої допомоги</option>
        <option value="medical_cert">Медичний сертифікат</option>
        <option value="education_cert">Освітній / педагогічний</option>
        <option value="criminal_record">Довідка про несудимість</option>
        <option value="other">Інший</option>
      </select></div>
      <div class="doc-file-input" id="doc-file-wrap">
        <label class="doc-file-label" for="doc-file-input">
          <span class="doc-file-label-text">Обрати файл (PDF, JPG, PNG)</span>
        </label>
        <input type="file" id="doc-file-input" name="file" accept=".pdf,.jpg,.jpeg,.png,image/*" required>
        <p class="doc-file-selected" id="doc-file-selected" hidden>
          <span class="doc-file-selected-icon" aria-hidden="true">📎</span>
          <span class="doc-file-selected-name" id="doc-file-name"></span>
        </p>
      </div>
    </div>
    <button type="submit" class="btn btn-primary">Завантажити</button>
  </form>
  <p class="form-hint">Доступ до файлів лише у адміністратора</p></div>
</div>
</main>
  <div id="site-footer" hx-get="/partials/footer.html" hx-trigger="load" hx-swap="innerHTML"></div>
  <div hx-get="/partials/cookie.html" hx-trigger="load" hx-swap="innerHTML"></div>
  <script src="/js/routes.js"></script>
  <script src="/js/mock-data.js"></script>
  <script src="/js/api.js"></script>
  <script src="/js/roles.js"></script>
  <script src="/js/render.js"></script>
  <script src="/js/calendar.js"></script>
  <script src="/js/validation.js"></script>
  <script src="/js/auth.js"></script>
  <script src="/js/cabinet-core.js"></script>
  <script src="/js/cabinet-parent.js"></script>
  <script src="/js/cabinet-nanny.js"></script>
  <script src="/js/cabinet-admin.js"></script>
  <script src="/js/payments.js"></script>
  <script src="/js/content-loader.js"></script>
  <script src="/js/site-content.js"></script>
  <script src="/js/custom-select.js"></script>
  <script src="/js/app.js"></script>
  
  <script>
    document.body.addEventListener('htmx:afterSwap', function(e) {
      PP.afterPartialSwap?.(e.detail.target);
      if (e.detail.target.id === 'site-header') PP.initLayout();
    });
    document.addEventListener('DOMContentLoaded', async function() {
      if (PP.loadSiteContent) await PP.loadSiteContent();
      PP.initLayout();
      PP.initCookie();
      PP.initCabinetPage();
    });
  </script>
</body>
</html>
