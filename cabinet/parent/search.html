<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Пошук — Кабінет</title>
  <meta name="description" content="">
  <link rel="icon" href="/favicon.ico" sizes="any">
  <link rel="icon" href="/images/favicon-32x32.png" type="image/png" sizes="32x32">
  <link rel="icon" href="/images/favicon-16x16.png" type="image/png" sizes="16x16">
  <link rel="apple-touch-icon" href="/images/apple-touch-icon.png" sizes="180x180">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,500;0,9..40,600;0,9..40,700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/globals.css">
  
  <link rel="stylesheet" href="/css/header.css">
  <link rel="stylesheet" href="/css/footer.css">
  <link rel="stylesheet" href="/css/hero.css">
  <link rel="stylesheet" href="/css/nanny.css">
  <link rel="stylesheet" href="/css/calendar.css">
  <link rel="stylesheet" href="/css/auth.css">
  <link rel="stylesheet" href="/css/documents.css">
  <link rel="stylesheet" href="/css/page-decor.css">
  <link rel="stylesheet" href="/css/cabinet.css">
  <link rel="stylesheet" href="/css/payments.css">
  <script src="https://unpkg.com/htmx.org@2.0.4/dist/htmx.min.js"></script>
</head>
<body>
  <div id="site-header" hx-get="/partials/header.html" hx-trigger="load" hx-swap="innerHTML"></div>
  <main>
<div class="container cabinet-layout">
  <div class="cabinet-mobile-nav" id="parent-mobile-nav"></div>
  <aside class="cabinet-sidebar"><nav class="card" id="parent-nav"></nav></aside>
  <div><h1 class="cabinet-title">Пошук нянь</h1>
  <button type="button" class="btn btn-secondary filters-mobile-toggle btn-block" id="filters-toggle" aria-expanded="false" aria-controls="filters-mobile-panel">Фільтри</button>
  <div class="card filters-mobile-panel" id="filters-mobile-panel" role="dialog" aria-modal="true" aria-labelledby="filters-mobile-title">
    <div class="filters-mobile-sheet">
      <div class="filters-panel-head filters-mobile-head">
        <p class="filters-panel-title" id="filters-mobile-title">Фільтри</p>
        <button type="button" class="filters-mobile-close" id="filters-mobile-close" aria-label="Закрити фільтри">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M18 6L6 18M6 6l12 12"/></svg>
        </button>
      </div>
      <div class="filters-panel-body" id="filters-mobile"></div>
      <div class="filters-panel-footer filters-mobile-footer">
        <button type="button" class="btn btn-secondary" id="filters-reset-mobile">Скинути</button>
        <button type="button" class="btn btn-primary" id="filters-apply-mobile">Застосувати</button>
      </div>
    </div>
  </div>
  <div class="catalog-layout"><aside class="filters-desktop"><div class="card filters-panel"><div class="filters-panel-head"><h2 class="filters-panel-title">Фільтри</h2></div><div class="filters-panel-body" id="filters-desktop"></div>
        <div class="filters-panel-footer">
          <button type="button" class="btn btn-secondary btn-block" id="filters-reset-desktop">Скинути фільтри</button>
        </div>
      </div></aside>
  <div><p id="results-count"></p><div class="catalog-grid" id="catalog-grid"></div></div></div></div>
</div>
</main>
  <div id="site-footer" hx-get="/partials/footer.html" hx-trigger="load" hx-swap="innerHTML"></div>
  <div hx-get="/partials/cookie.html" hx-trigger="load" hx-swap="innerHTML"></div>
  <script src="/js/routes.js"></script>
  <script src="/js/mock-data.js"></script>
  <script src="/js/api.js"></script>
  <script src="/js/roles.js"></script>
  <script src="/js/render.js"></script>
  <script src="/js/calendar.js"></script>
  <script src="/js/validation.js"></script>
  <script src="/js/auth.js"></script>
  <script src="/js/cabinet-core.js"></script>
  <script src="/js/cabinet-parent.js"></script>
  <script src="/js/cabinet-nanny.js"></script>
  <script src="/js/cabinet-admin.js"></script>
  <script src="/js/payments.js"></script>
  <script src="/js/content-loader.js"></script>
  <script src="/js/site-content.js"></script>
  <script src="/js/app.js"></script>
  
  <script>
    document.body.addEventListener('htmx:afterSwap', function(e) {
      PP.afterPartialSwap?.(e.detail.target);
      if (e.detail.target.id === 'site-header') PP.initLayout();
    });
    document.addEventListener('DOMContentLoaded', async function() {
      if (PP.loadSiteContent) await PP.loadSiteContent();
      PP.initLayout();
      PP.initCookie();
      PP.initCabinetPage(); PP.initCatalog();
    });
  </script>
</body>
</html>
